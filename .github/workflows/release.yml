name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"
          cache: "npm"

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 libfuse2t64 fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Install macOS specific dependencies
        if: matrix.os == 'macos-latest'
        run: npm install appdmg electron-installer-dmg --no-save

      - name: Import Apple Code Signing Certificate
        if: matrix.os == 'macos-latest'
        env:
          CERT_DATA: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VAR: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASS: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT_DATA" ]; then
            echo "::notice::No signing certificate in secrets — using ad-hoc signing"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo "$CERT_DATA" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/notarytool

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID_VAR" >> "$GITHUB_ENV"
          echo "APPLE_NOTARIZATION_PASSWORD=$NOTARIZATION_PASS" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Build Application
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Artifacts
        run: ls -R artifacts

      - name: Determine Release Tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          IS_PRERELEASE: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        run: |
          if [ "$IS_TAG" == "true" ]; then
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            DATE=$(date +%Y%m%d-%H%M%S)
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v${VERSION}-build-${DATE}-${SHORT_SHA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git tag -a "$TAG" -m "Automated build from main - ${DATE}"
            git push origin "$TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          artifacts: "artifacts/**/*"
          allowUpdates: true
          generateReleaseNotes: true
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}


