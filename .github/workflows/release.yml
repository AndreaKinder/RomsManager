name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 libfuse2t64 fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Install macOS specific dependencies
        if: matrix.os == 'macos-latest'
        run: npm install appdmg electron-installer-dmg --no-save

      - name: Build Application
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Artifacts
        run: ls -R artifacts

      - name: Determine Release Tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          IS_PRERELEASE: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        run: |
          if [ "$IS_TAG" == "true" ]; then
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            DATE=$(date +%Y%m%d-%H%M%S)
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v${VERSION}-build-${DATE}-${SHORT_SHA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git tag -a "$TAG" -m "Automated build from main - ${DATE}"
            git push origin "$TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          artifacts: "artifacts/**/*"
          allowUpdates: true
          generateReleaseNotes: true
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH=$(find artifacts -name "*.dmg" -type f | head -1)
          echo "DMG found at: $DMG_PATH"

          SHA256=$(sha256sum "$DMG_PATH" | cut -d ' ' -f 1)
          echo "SHA256: $SHA256"

          VERSION="${GITHUB_REF_NAME#v}"
          CASK_FILE="homebrew-tap/Casks/romsmanager.rb"

          sed -i "s/version \".*\"/version \"$VERSION\"/" "$CASK_FILE"
          sed -i "s/sha256 :no_check/sha256 \"$SHA256\"/" "$CASK_FILE"

          # Commit updated cask to RomsManager (source repo)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add "$CASK_FILE"
          git commit -m "chore: update cask for ${GITHUB_REF_NAME} [skip ci]"
          git push origin main

          # Push the same update to the standalone homebrew-tap repo
          TAP_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/AndreaKinder/homebrew-tap.git"
          git clone --depth 1 "$TAP_REPO" /tmp/homebrew-tap
          cp "$CASK_FILE" /tmp/homebrew-tap/Casks/romsmanager.rb
          git -C /tmp/homebrew-tap add Casks/romsmanager.rb
          git -C /tmp/homebrew-tap commit -m "chore: update cask for ${GITHUB_REF_NAME}"
          git -C /tmp/homebrew-tap push origin main
