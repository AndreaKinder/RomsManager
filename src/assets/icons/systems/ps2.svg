<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#1a1a2e"/>
  <!-- PS2 console body (horizontal slim) -->
  <rect x="6" y="22" width="52" height="20" rx="4" fill="#003087"/>
  <!-- Disc slot line -->
  <rect x="14" y="31" width="28" height="2" rx="1" fill="#0070cc"/>
  <!-- Power indicator -->
  <circle cx="50" cy="32" r="3" fill="#00c8ff"/>
  <!-- Memory card slots -->
  <rect x="8" y="26" width="6" height="8" rx="1" fill="#001a4d"/>
  <!-- USB port hint -->
  <rect x="8" y="38" width="6" height="3" rx="1" fill="#001a4d"/>
</svg>
