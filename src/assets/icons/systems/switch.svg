<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#1a1a2e"/>
  <!-- Left Joy-Con -->
  <rect x="4" y="16" width="14" height="32" rx="7" fill="#4169e1"/>
  <!-- Left joystick -->
  <circle cx="11" cy="24" r="4" fill="#2a4abd"/>
  <!-- Left buttons -->
  <rect x="7" y="32" width="8" height="2" rx="1" fill="#2a4abd"/>
  <rect x="7" y="36" width="8" height="2" rx="1" fill="#2a4abd"/>
  <!-- Right Joy-Con -->
  <rect x="46" y="16" width="14" height="32" rx="7" fill="#e8003a"/>
  <!-- Right joystick -->
  <circle cx="53" cy="36" r="4" fill="#b0002c"/>
  <!-- Right buttons (ABXY) -->
  <circle cx="53" cy="24" r="2" fill="#b0002c"/>
  <circle cx="57" cy="27" r="2" fill="#b0002c"/>
  <circle cx="49" cy="27" r="2" fill="#b0002c"/>
  <circle cx="53" cy="30" r="2" fill="#b0002c"/>
  <!-- Screen / tablet -->
  <rect x="17" y="12" width="30" height="40" rx="3" fill="#2c2c3e"/>
  <rect x="19" y="14" width="26" height="36" rx="2" fill="#0d1b2a"/>
  <rect x="20" y="15" width="24" height="34" rx="1" fill="#1a6b3c" opacity="0.8"/>
</svg>
